apiVersion: apps/v1
kind: Deployment
metadata:
  name: octopub-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        component: web
    spec:
      containers:
        - name: web
          image: index.docker.io/octopussamples/octopub-frontend:20260909.752.1
          ports:
            - containerPort: 8080
              name: http-port
          env:
            - name: clientIdentifier
              value: ""
            - name: featureToggleSlug
              value: ""